name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.5.8
        required: true
        type: string
      draft:
        description: Create the GitHub Release as a draft
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-macos-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Secret-free release preflight
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out requested tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and public-main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' project.yml | head -1)"
          [[ "${RELEASE_TAG}" == "v${version}" ]]
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" == "$(git rev-parse HEAD)" ]]
          git merge-base --is-ancestor HEAD origin/main

      - name: Install public verification tools
        run: brew install gitleaks trufflehog xcodegen

      - name: Enforce public-source boundary
        run: scripts/ci/public-source-gate.sh

      - name: Scan history and tracked worktree
        run: scripts/ci/scan-secrets.sh

      - name: Cache native speech libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Vendor
          key: ${{ runner.os }}-${{ runner.arch }}-sherpa-${{ hashFiles('scripts/fetch-sherpa-onnx.sh') }}

      - name: Fetch native speech libraries
        run: scripts/fetch-sherpa-onnx.sh

      - name: Test ResponsayCore
        run: swift test --package-path Packages/ResponsayCore

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build macOS tests without signing
        run: >-
          xcodebuild -quiet build-for-testing
          -scheme ResponsayMac
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

  release:
    name: Sign, notarize, and publish
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 90
    environment: public-release
    permissions:
      contents: write # Required only to create the GitHub Release.
    steps:
      - name: Check out requested tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Cache native speech libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Vendor
          key: ${{ runner.os }}-${{ runner.arch }}-sherpa-${{ hashFiles('scripts/fetch-sherpa-onnx.sh') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch native speech libraries
        run: scripts/fetch-sherpa-onnx.sh

      - name: Recheck public-source boundary
        run: scripts/ci/public-source-gate.sh

      - name: Build signed and notarized release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RESPONSAY_DEVELOPER_ID_P12_BASE64: ${{ secrets.RESPONSAY_DEVELOPER_ID_P12_BASE64 }}
          RESPONSAY_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.RESPONSAY_DEVELOPER_ID_P12_PASSWORD }}
          RESPONSAY_APPLE_TEAM_ID: ${{ secrets.RESPONSAY_APPLE_TEAM_ID }}
          RESPONSAY_ASC_KEY_P8_BASE64: ${{ secrets.RESPONSAY_ASC_KEY_P8_BASE64 }}
          RESPONSAY_ASC_KEY_ID: ${{ secrets.RESPONSAY_ASC_KEY_ID }}
          RESPONSAY_ASC_ISSUER_ID: ${{ secrets.RESPONSAY_ASC_ISSUER_ID }}
          RESPONSAY_SPARKLE_ED_KEY_BASE64: ${{ secrets.RESPONSAY_SPARKLE_ED_KEY_BASE64 }}
        run: scripts/release-macos.sh "$RELEASE_TAG"

      - name: Upload notarized runner artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Responsay-${{ inputs.tag }}-macOS
          path: |
            build/release/*.dmg
            build/release/*.sha256
            build/release/appcast.xml
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(build/release/*.dmg build/release/*.sha256 build/release/appcast.xml)
          args=("${RELEASE_TAG}" "${assets[@]}" --verify-tag --title "Responsay ${RELEASE_TAG}" --generate-notes)
          if [[ "${RELEASE_DRAFT}" == "true" ]]; then
            args+=(--draft)
          fi
          gh release create "${args[@]}"
